services:
  pg-database:
    image: postgres:13
    environment:
      POSTGRES_USER: parth
      POSTGRES_PASSWORD: parth
      POSTGRES_DB: ny_taxi
    volumes:
      - "./ny_taxi_postgres_data:/var/lib/postgresql/data:rw"
    ports:
      - "5433:5432"
    networks:
      - pg_network
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "parth"]
      interval: 5s
      retries: 5
    restart: always

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: root
    ports:  
      - "8080:80"
    networks:
      - pg_network

networks:
  pg_network:
    driver: bridge
